name: Link Comments

# Puts a "▶ Full video: <link>" comment from the channel on every public Short that doesn't have
# one yet (see scripts/link_comments.py). Daily after both publish times (14:30 and 18:30 UTC).
# Manual runs only list what they would post unless dry_run is false.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be posted"
        type: boolean
        default: true
  schedule:
    - cron: "17 19 * * *"

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python packages
        run: pip install -q python-dotenv google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Comment
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then python scripts/link_comments.py --dry-run; else python scripts/link_comments.py; fi
