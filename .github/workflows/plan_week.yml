name: Week Plan

# Plans next week's uploads in one go (scripts/plan_week.py): one explainer topic and one kids
# question per day, from the channel's own numbers, this week's YouTube and Hugging Face trends and
# the topic banks; every pick checked against the channel by words and by meaning.
# Runs Saturday so the owner can review data/week_plan.json before Monday. Read-only on YouTube;
# it commits data/week_plan.json, data/content_db.json and data/topic_index.npz to main.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day: YYYY-MM-DD, tomorrow or next-monday"
        default: next-monday
      days:
        description: "Number of days"
        default: "7"
      dry_run:
        description: "Dry run: print the plan, commit nothing"
        type: boolean
        default: false
  # Saturday 09:00 UTC: after YouTube's daily quota resets (08:00 UTC), before the daily uploads.
  schedule:
    - cron: "0 9 * * 6"

concurrency:
  group: plan-week
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FREE_ONLY: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Run It Local' }}
      GEMINI_FREE_MODELS: ${{ vars.GEMINI_FREE_MODELS || 'gemini-3.5-flash-lite,gemini-3.8-flash' }}
      GROQ_FREE_MODELS: ${{ vars.GROQ_FREE_MODELS || 'openai/gpt-oss-120b,qwen/qwen3-32b' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_SCRIPT_MODEL: ${{ vars.CLAUDE_SCRIPT_MODEL || 'claude-opus-5-5' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Python packages
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          node-version: "22"
      - name: Claude Code CLI (planner)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund && claude --version
      - name: Plan the week
        env:
          IN_START: ${{ inputs.start || 'next-monday' }}
          IN_DAYS: ${{ inputs.days || '7' }}
          IN_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--start "$IN_START" --days "$IN_DAYS")
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/plan_week.py "${args[@]}"
      - name: Commit the plan
        if: success() && inputs.dry_run != true
        run: |
          git config user.email "autotube-bot@users.noreply.github.com"
          git config user.name "AutoTube Bot"
          python scripts/commit_state.py -m "chore: week plan [skip ci]" \
            --replace data/week_plan.json data/content_db.json data/topic_index.npz
