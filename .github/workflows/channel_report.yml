name: Channel Report

# Read-only: one JSON snapshot of the channel's numbers (see scripts/channel_report.py),
# published as the asset report.json on the release "channel-report" so the report page can
# be refreshed from a public URL, and as report.json on the branch report-data (read raw by the
# report page each time it opens). Daily, after YouTube Analytics has usually updated.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # release asset + the report-data branch (main is never touched)
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ vars.INSTAGRAM_ACCOUNT_ID || '' }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python packages
        run: pip install -q requests python-dotenv google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Build the report
        run: python scripts/channel_report.py --days 90 --out report.json
      - name: Publish report.json
        run: |
          gh release view channel-report --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create channel-report --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Channel report data" --notes "report.json is rewritten daily by the Channel Report workflow."
          gh release upload channel-report report.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish report.json on the report-data branch
        # The report page reads this raw file each time it opens. One orphan commit, force-pushed,
        # so the branch never grows. [skip ci] keeps it from starting the test workflow.
        run: |
          mkdir /tmp/report-data && cp report.json /tmp/report-data/ && cd /tmp/report-data
          git init -q -b report-data
          git add report.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Channel report $(date -u +%FT%H:%MZ) [skip ci]"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" report-data
